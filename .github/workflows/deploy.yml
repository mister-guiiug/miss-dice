# Déploiement GitHub Pages délégué au reusable workflow famille (dev-pwa-config).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

# La concurrence (group: pages, cancel-in-progress) est portée par le reusable
# pwa-deploy@v4 lui-même — un bloc `concurrency` au niveau de ce workflow (dont
# l'unique job est un appel reusable) fait échouer la validation.

jobs:
  deploy:
    uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-deploy.yml@v4
    # PAS de `secrets: inherit` : le seul secret déclaré par
    # `pwa-deploy.yml` est `FIREBASE_SERVICE_ACCOUNT_KEY`, et ce dépôt ne
    # déploie pas sur Firebase. Hériter enverrait TOUS les secrets du dépôt
    # à un workflow qui n'en attend aucun ici.
    with:
      use-base-path: true
