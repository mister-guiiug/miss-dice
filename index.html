<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- La Content-Security-Policy est injectée au build par cspPlugin()
         (@mister-guiiug/dev-wpa-config/vite-csp) : script-src par hash SHA-256
         de l'IIFE anti-FOUC ci-dessous, plus de 'unsafe-inline'. -->
    <!-- Pas de maximum-scale / user-scalable=no : bloquer le zoom viole
         WCAG 1.4.4 (agrandissement du texte) et nuit à l'accessibilité. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f1220" />
    <meta name="color-scheme" content="dark light" />
    <script>
      /* Pré-peinture du thème : pose data-theme avant le 1er rendu pour
         éviter tout flash. Lit la préférence stockée, sinon le système.

         DEUX SOURCES, dans cet ordre. La clé nue `miss-dice_theme` est celle
         qu'écrit `react/use-theme` du socle et fait donc autorité. À défaut,
         on relit le champ `theme` de l'ancien blob `miss-dice:settings` :
         sans ce repli, le premier chargement après la mise à jour peindrait
         le thème système avant que React ne migre la valeur — soit le flash
         que ce script existe pour éviter, sur le seul chargement où il se
         verrait le plus. `auto` était le mot de l'app pour `system`. */
      (function () {
        try {
          var pref = localStorage.getItem('miss-dice_theme');
          if (pref !== 'light' && pref !== 'dark' && pref !== 'system') {
            pref = 'system';
            var raw = localStorage.getItem('miss-dice:settings');
            if (raw) {
              var p = JSON.parse(raw);
              if (p && (p.theme === 'light' || p.theme === 'dark'))
                pref = p.theme;
            }
          }
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = dark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', dark ? '#0f1220' : '#f4f5fb');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
