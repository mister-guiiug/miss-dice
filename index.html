<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- La Content-Security-Policy est injectée au build par cspPlugin()
         (@mister-guiiug/dev-wpa-config/vite-csp) : script-src par hash SHA-256
         de l'IIFE anti-FOUC ci-dessous, plus de 'unsafe-inline'. -->
    <!-- Pas de maximum-scale / user-scalable=no : bloquer le zoom viole
         WCAG 1.4.4 (agrandissement du texte) et nuit à l'accessibilité. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f1220" />
    <meta name="color-scheme" content="dark light" />
    <script>
      /* Pré-peinture du thème : pose data-theme avant le 1er rendu pour
         éviter tout flash. Lit la préférence stockée, sinon le système. */
      (function () {
        try {
          var raw = localStorage.getItem('miss-dice:settings');
          var pref = 'auto';
          if (raw) {
            var p = JSON.parse(raw);
            if (
              p &&
              (p.theme === 'light' || p.theme === 'dark' || p.theme === 'auto')
            )
              pref = p.theme;
          }
          var dark =
            pref === 'dark' ||
            (pref === 'auto' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = dark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', dark ? '#0f1220' : '#f4f5fb');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Miss Dice" />
    <meta
      name="description"
      content="Lancer un dé à 6 faces d'un simple tap. Mobile-first, 100 % offline, sans pub ni tracking."
    />
    <link rel="canonical" href="__SEO_HOME_URL__" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Miss Dice" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="__SEO_HOME_URL__" />
    <meta property="og:title" content="Miss Dice — lance un dé" />
    <meta
      property="og:description"
      content="Lancer un dé à 6 faces d'un simple tap. Mobile-first, 100 % offline, sans pub ni tracking."
    />
    <meta property="og:image" content="__SEO_LOGO_URL__" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Miss Dice — lance un dé" />
    <meta
      name="twitter:description"
      content="Lancer un dé à 6 faces d'un simple tap, 100 % offline et installable (PWA)."
    />
    <meta name="twitter:image" content="__SEO_LOGO_URL__" />

    <!-- Analytics (GTM/GA4) injecté par pwaSeoPlugin() — vide tant qu'aucun
         VITE_GTM_CONTAINER_ID / VITE_GA_MEASUREMENT_ID n'est configuré. -->
    __ANALYTICS_HEAD__
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="icons/apple-touch-icon.png"
    />
    <title>Miss Dice — lance un dé</title>
  </head>
  <body>
    __ANALYTICS_BODY__
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
